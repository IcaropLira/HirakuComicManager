<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiraku Comics Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ee;--pn:#fff;--ink:#1c1b22;--mut:#716f7b;--ln:#dedbe4;--acc:#7a6db0;--edge:#8d8a9c;color-scheme:light;--acc-ink:#fff;--serif:Georgia,"Times New Roman",serif;--doc-w:820px;--doc-fs:15px;--doc-lh:1.6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--pn:#1d1c24;--ink:#ebe9f2;--mut:#9b98a8;--ln:#2e2c39;--acc:#a498cf;--edge:#6f6c80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141a;--pn:#1d1c24;--ink:#ebe9f2;--mut:#9b98a8;--ln:#2e2c39;--acc:#a498cf;--edge:#6f6c80;color-scheme:dark}
:root[data-theme="sepia"]{--bg:#f1e8d6;--pn:#faf3e3;--ink:#3b3126;--mut:#7d6e5a;--ln:#dccfb6;--acc:#9a5b2e;--edge:#a39279;color-scheme:light}
:root[data-theme="sakura"]{--bg:#f8f0f2;--pn:#fffafb;--ink:#2a1f24;--mut:#85707a;--ln:#ead9de;--acc:#c2577f;--edge:#a58b95;color-scheme:light}
:root[data-theme="midnight"]{--bg:#000;--pn:#0b0b0f;--ink:#ecebf3;--mut:#8e8c9b;--ln:#23222c;--acc:#b3a7ff;--edge:#6a677a;color-scheme:dark}
:root[data-theme="ocean"]{--bg:#0e1a24;--pn:#13232f;--ink:#e3eef5;--mut:#8aa3b3;--ln:#223645;--acc:#5cb8d6;--edge:#5f7d90;color-scheme:dark}
:root[data-theme="forest"]{--bg:#111a15;--pn:#17231c;--ink:#e6efe8;--mut:#8fa596;--ln:#263629;--acc:#7cc08f;--edge:#66806e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
header{grid-column:1/-1;display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.app>aside,.app>#view{grid-row:2}
#toasts{position:fixed;right:16px;bottom:40px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.gh-code{display:inline-block;margin:10px 0;padding:10px 16px;font:700 28px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.2em;background:var(--bg);border:2px dashed var(--acc);border-radius:8px;user-select:all}
.toast{background:var(--pn);color:var(--ink);border:1px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.2)}.toast[hidden]{display:none}.toast button{margin-left:6px;cursor:pointer}
.app-footer a{color:var(--acc);text-decoration:none}.app-footer a:hover{text-decoration:underline}
.app-footer{grid-column:1/-1;grid-row:3;padding:5px 14px;border-top:1px solid var(--ln);color:var(--mut);font-size:11px;text-align:center}
h1{font:700 17px var(--serif);margin:0;letter-spacing:.2px}
.badge{font-size:11px;color:var(--mut)}
nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside{padding:14px;overflow:auto;border-right:1px solid var(--ln)}
aside.r{border-right:0;border-left:1px solid var(--ln)}
label{display:block;margin:0 0 12px;color:var(--mut);font-size:12px}
label span{float:right;color:var(--ink)}
select,input[type=range]{width:100%;margin-top:4px;font:inherit}
select{background:var(--pn);color:var(--ink);color-scheme:inherit;border:1px solid var(--ln);border-radius:6px;padding:5px}
input[type=range]{accent-color:var(--acc)}
#view{overflow:auto;position:relative;min-height:0}
svg{display:block}
.empty,.mut{color:var(--mut)}.empty{padding:24px}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:10px;padding:0 8px;margin:2px 3px 2px 0;font-size:12px;background:var(--pn)}
.tag.off,td.off,th.off{opacity:.3}
.chip{cursor:pointer}.chip:hover{border-color:var(--acc)}
h3{margin:0 0 2px;font:700 16px var(--serif)}h5{margin:12px 0 4px;font-size:12px;color:var(--mut);font-weight:600}
b.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.lg div{font-size:12px;margin:3px 0;color:var(--mut)}
.sc{padding:12px}table{border-collapse:collapse;font-size:12px}
th{font-weight:600;padding:2px 6px;text-align:center}th small{display:block;color:var(--mut);font-weight:400}
td{border:1px solid var(--ln);height:24px;min-width:34px;text-align:center}
td.nm{text-align:left;padding:0 10px;white-space:nowrap;cursor:pointer;background:var(--pn)}
td.nm.on{outline:2px solid var(--acc);outline-offset:-2px}
td i{display:inline-block;width:70%;height:12px;border-radius:3px}
tr.sec td{border:0;background:none;text-align:left;padding-top:14px;color:var(--mut);font-weight:600;height:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px}
.card h4{margin:0;font:700 14px var(--serif)}
label.ck{display:flex;gap:6px;align-items:center;margin:3px 0;color:var(--ink);font-size:13px}
.ty{margin-bottom:8px}.ty details{margin-left:22px;font-size:12px;color:var(--mut)}.ty summary{cursor:pointer}
.ty button{font:inherit;font-size:11px;background:none;border:1px solid var(--ln);color:var(--mut);border-radius:8px;margin-right:4px;cursor:pointer}
.tg{font:inherit;font-size:12px;color:var(--mut);background:none;border:1px solid var(--ln);border-radius:12px;padding:2px 10px;margin:2px;cursor:pointer}
.tg.on,.tag.on{color:var(--ink);background:var(--pn);border-color:var(--acc)}
.bar{padding:10px 14px;border-bottom:1px solid var(--ln)}
.track{display:flex;gap:6px;overflow-x:auto;padding:22px 14px 10px;background:linear-gradient(var(--ln),var(--ln)) 0 36px/100% 2px no-repeat}
.stop{flex:0 0 112px;text-align:center;cursor:pointer;padding:6px 4px;border-radius:8px;border:1px solid transparent;font-size:12px}
.stop.on{background:var(--pn);border-color:var(--acc)}.stop b{display:block}.stop span{display:block;color:var(--mut)}
.stop .dot{width:16px;height:16px;border-radius:50%;margin:0 auto 6px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding:14px}
.pc{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;animation:fi .25s}
.pc h4{margin:0 0 6px;font:700 14px var(--serif)}.pc div{margin:3px 0}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pc{animation:none}}
.vs{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px 0}
.vc{border:1px solid var(--ln);border-left-width:5px;border-radius:6px;padding:6px 10px;background:var(--pn);font-size:12px}
.ap{display:flex;gap:4px;flex-wrap:wrap}.ap div{width:50px;text-align:center;font-size:11px;border-radius:4px;padding:3px 0;border:1px solid var(--ln)}
.rv{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--ln);font-size:12px}
.rv .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rv small{color:var(--mut)}
.rv select{width:auto;margin:0;font-size:12px}
.es{margin:0 14px 12px}
.es textarea,.es input,.es select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;box-sizing:border-box;margin:0}
.es textarea{width:100%;resize:vertical}.es select{width:auto}
.eh{display:flex;gap:8px;margin-bottom:8px}.eh .ht{flex:1;font:700 15px var(--serif)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:8px}
.ef{display:grid;grid-template-columns:1fr auto;gap:4px;margin-bottom:6px}.ef input[data-ef=k]{font-weight:600;grid-column:1/-1}
.ef.rl{grid-template-columns:1fr 140px auto}.ef.rl textarea{grid-column:1/-1}
.ef.vr{display:flex;flex-wrap:wrap}.ef.vr input{width:auto;flex:1;min-width:110px}
#htype{width:auto;margin:0 6px 0 10px}
.hw{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 190px);min-height:420px}
.ho{overflow:auto;border-right:1px solid var(--ln);padding:10px 12px;font-size:12px}
.hs{overflow:auto;height:100%;padding:18px 12px}
.np{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;background:var(--bg)}
.np-explorer{padding:14px 10px;border-right:1px solid var(--ln);background:var(--pn)}
.np-explorer-head{display:flex;align-items:center;justify-content:space-between;padding:0 5px 10px}
.np-explorer-head b{font:700 13px var(--serif)}
.np-search{width:100%;box-sizing:border-box;margin:0 0 8px;padding:6px 8px;border:1px solid var(--ln);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px}
.np-row{display:flex;gap:2px;align-items:center;margin:2px 0 2px calc(var(--depth,0)*14px)}
.np-row>button:first-child{display:flex;flex:1;min-width:0;gap:8px;align-items:center;padding:7px 6px;border:1px solid transparent;border-radius:5px;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.np-row>button:first-child:hover,.np-row.active>button:first-child{background:var(--bg)}
.np-row.active>button:first-child{border-color:var(--ln)}
.np-icon{flex:none;color:var(--acc)}
.np-label{min-width:0}.np-label b,.np-label small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.np-label b{font-size:12px;font-weight:600}.np-label small{margin-top:2px;color:var(--mut);font-size:10px}
.np-delete{opacity:0;border:0;border-radius:4px;background:none;color:var(--mut);font-size:17px;cursor:pointer}.np-row:hover .np-delete,.np-delete:focus-visible{opacity:1}.np-delete:hover{color:#b0605c;background:var(--bg)}
.np-document{min-width:0;padding:28px clamp(18px,5vw,72px) 60px;overflow:auto}
.np-topline{display:flex;align-items:center;gap:8px;min-height:28px;color:var(--mut);font-size:11px}
.np-status{margin-left:auto}
.np-title{display:block;width:100%;max-width:820px;margin:28px auto 20px;padding:0;border:0;outline:0;background:transparent;color:var(--ink);font:700 34px/1.2 var(--serif)}
.np-title::placeholder{color:var(--mut)}
.np-content{max-width:820px;margin:0 auto}
.np-empty{max-width:540px;margin:18vh auto 0;text-align:center}.np-empty h2{font:700 24px var(--serif)}.np-empty p{color:var(--mut)}
.np-empty .tg{margin-top:8px}
@media(max-width:700px){.np{grid-template-columns:minmax(0,1fr)}.np-explorer{border-right:0;border-bottom:1px solid var(--ln);max-height:230px;overflow:auto}.np-document{padding:22px 18px 42px}.np-title{font-size:28px;margin-top:22px}}
.op{font-weight:600;margin-top:10px;cursor:pointer}.oq{margin-left:12px;color:var(--mut);cursor:pointer}.op:hover,.oq:hover{color:var(--ink)}
.dt i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px}
.tg.lay{color:var(--acc);border-color:var(--acc);font-weight:700;padding:3px 14px}.tg.lay:hover{background:var(--pn)}.tg.lay.on{background:var(--acc);color:#fff}
.nl-sheet{max-width:860px;margin:18px auto 40px;background:var(--pn);border:1px solid var(--ln);border-top:6px solid var(--nlc,var(--acc));border-radius:10px;padding:30px 40px 36px;box-shadow:0 6px 28px rgba(0,0,0,.08)}
.nl-kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nlc,var(--acc));font-weight:700}
.nl-title{font:700 36px/1.15 var(--serif);margin:4px 0 10px}
.nl-sec{margin-top:26px}.nl-sec h2{font:700 20px var(--serif);border-bottom:2px solid var(--ln);padding-bottom:6px;margin:0 0 12px}
.nl-grid{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:8px 20px;margin:0}.nl-grid dt{color:var(--mut);font-weight:600}.nl-grid dd{margin:0}
.nl-body{font:15px/1.65 var(--serif)}.nl-body p{margin:8px 0}.nl-body h3{font:700 18px var(--serif);margin:18px 0 6px}.nl-body blockquote{margin:10px 0;padding:4px 14px;border-left:4px solid var(--acc);color:var(--mut)}
.nl-body pre{background:var(--bg);border-radius:6px;padding:10px;overflow:auto;font-size:13px}.nl-body hr{border:0;border-top:1px solid var(--ln);margin:16px 0}.nl-body img{max-width:100%;border-radius:6px}
.nl-li{display:flex;gap:8px;margin:3px 0}.nl-mk{color:var(--acc);min-width:18px;text-align:right}.nl-co{display:flex;gap:10px;background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0}
.nl-rel{border:1px solid var(--ln);border-left:5px solid var(--edge);border-radius:6px;padding:8px 12px;margin:6px 0}.nl-d{color:var(--mut);font-size:13px;margin-top:3px}
.crumb{cursor:pointer;color:var(--acc)}.crumb:hover{text-decoration:underline}.nl-crumbs{font-size:12px;color:var(--mut);margin-bottom:4px}.nl-crumbs:empty{display:none}
.nl-child{margin-left:12px;border-left:3px solid var(--ln);padding-left:18px}.nl-child .nl-sec h2{font-size:16px}
.nl-vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.nl-sheet .wl{cursor:pointer}
@media print{.bar,aside,nav,header,.app-footer,#toasts{display:none!important}.nl-sheet{box-shadow:none;border:0}}
.sheet{max-width:780px;margin:0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:22px 26px}
.bk{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start;padding:2px 6px;margin:2px 0;border-radius:6px;border-left:3px solid transparent}
.bk:focus-within{background:var(--bg);border-left-color:var(--acc)}
.bk .lb{font-size:11px;color:var(--mut);padding-top:8px;text-align:right}

.bk.pg{grid-template-columns:70px minmax(0,1fr);margin-top:28px;border-top:2px solid var(--ln);padding-top:10px}.bk.pg input{font:700 20px var(--serif)}
.bk.pn{grid-template-columns:70px minmax(0,1fr) auto;margin-top:14px}.bk.pn input{font:700 14px var(--serif)}
.bk.fl{grid-template-columns:70px 150px 120px minmax(0,1fr)}.bk.fl .who{font-weight:700;text-transform:uppercase}.bk.fl .who.bad{color:#b0707a}.bk.fl .par{font-style:italic;color:var(--mut)}
.bk.leg textarea{font-style:italic}.bk.sfx textarea{font-weight:700;letter-spacing:1px}.bk.nota textarea,.bk.nota .lb{color:var(--mut)}.bk.nota{background:var(--bg)}
.wc{font-size:11px;color:var(--mut);padding-top:8px}.wc.hi{color:#b0707a;font-weight:700}
.hl p{margin:6px 0;font:14px/1.55 var(--serif)}.lp{font:700 20px var(--serif);border-top:2px solid var(--ln);padding-top:12px;margin:26px 0 8px}.lq{margin-top:12px}
.ld{margin:6px 0 6px 40px;font-size:13px}.ln{margin:6px 0;padding:4px 8px;background:var(--bg);color:var(--mut);font-size:12px;border-radius:4px}
h1{cursor:pointer}
.hp h5{margin:20px 18px 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.hp>div:last-child{padding-bottom:18px}
.hh{padding:28px 18px 4px}.hh h2{margin:0;font:700 32px var(--serif)}
.project-heading{display:flex;align-items:center;gap:8px}.project-heading .tg{opacity:.55}.project-heading:hover .tg,.project-heading .tg:focus-visible{opacity:1}.project-heading input{width:min(440px,70vw);font:700 32px var(--serif);color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:4px 8px}
.hc{padding:14px}.hc:hover{border-color:var(--acc)}.hi2{font-size:20px;color:var(--acc)}.hc b{display:block;margin-top:4px}.hn{margin-top:6px;font-size:12px;color:var(--acc)}
select,.es select,.rv select,#htype{appearance:none;-webkit-appearance:none;background-color:var(--pn);color:var(--ink);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238d8a9c' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:26px;border:1px solid var(--ln);border-radius:6px}
option{background-color:var(--pn);color:var(--ink);color-scheme:inherit}
.app>aside:not(.r){grid-column:1}.app>aside.r{grid-column:3}.app>#view{grid-column:2}
.app.nl>aside:not(.r),.app.nr>aside.r{display:none}
.app.nl{grid-template-columns:0 minmax(0,1fr) 250px}.app.nr{grid-template-columns:230px minmax(0,1fr) 0}.app.nl.nr{grid-template-columns:0 minmax(0,1fr) 0}
@media (max-width:820px){.app>aside:not(.r),.app>aside.r,.app>#view{grid-column:1}.app.nl,.app.nr,.app.nl.nr{grid-template-columns:1fr}}
.be{padding:2px 0 2px 18px;min-height:36px}
.nb{position:relative;display:flex;align-items:flex-start;gap:4px;padding:1px 0;border-radius:4px;border-top:2px solid transparent;border-bottom:2px solid transparent;transition:background .16s ease,box-shadow .16s ease,opacity .16s ease}.nb.dov,.nb.dov2{background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:inset 3px 0 0 var(--acc)}.nb.dov{transform:translateY(3px)}.nb.dov2{transform:translateY(-3px)}
.nb.dov:before,.nb.dov2:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--acc);pointer-events:none}.nb.dov:before{top:-4px}.nb.dov2:after{bottom:-4px}
.nb.dragging{opacity:.3;transform:scale(.985)}.nb.dropped{animation:drop-pop .24s ease-out}

/* ===== Header, Páginas e Configurações ===== */
header.topbar{position:relative;z-index:40;flex-wrap:nowrap;gap:14px;padding:8px 16px;min-height:54px;box-sizing:border-box;background:var(--pn);border-bottom:1px solid var(--ln);box-shadow:0 8px 18px -14px rgba(0,0,0,.5)}

.brand{display:flex;align-items:center;gap:10px;min-width:0}

nav{display:flex;align-items:center;gap:2px;margin:0 auto;padding:3px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}

.nvg{position:relative}

.nvm{position:absolute;left:0;top:calc(100% + 8px);min-width:170px;padding:6px;display:none;flex-direction:column;gap:2px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);z-index:50}

.ib:focus-visible,.brand-mark:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
